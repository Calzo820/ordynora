services:
  - type: web
    name: easymenu-backend
    env: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RESERVATION_SLOT_MINUTES
        value: "120"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_DEFAULT_COUNTRY
        value: IT
      - key: PUBLIC_TABLE_PAYMENTS_ENABLED
        value: "false"
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_SEMIANNUAL
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        value: easy.menu.service@gmail.com
      - key: MAIL_FROM_NAME
        value: EasyMenu
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: MONITOR_WEBHOOK_URL
        sync: false
      - key: MONITOR_WEBHOOK_TOKEN
        sync: false
      - key: BACKUP_ENABLED
        value: "false"
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_UPLOAD_URL
        sync: false
      - key: BACKUP_UPLOAD_TOKEN
        sync: false
