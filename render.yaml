services:
  - type: web
    name: ordynora-backend
    env: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: SESSION_DAYS
        value: "14"
      - key: STAFF_SESSION_DAYS
        value: "90"
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_WORKER_ENABLED
        value: "true"
      - key: INTEGRATION_WORKER_INTERVAL_MS
        value: "2000"
      - key: INTEGRATION_WORKER_CONCURRENCY
        value: "4"
      - key: INTEGRATION_MAX_ATTEMPTS
        value: "8"
      - key: INTEGRATION_HTTP_TIMEOUT_MS
        value: "15000"
      - key: INTEGRATION_JOB_RETENTION_DAYS
        value: "30"
      - key: INTEGRATION_DISCOVERY_CACHE_MS
        value: "120000"
      - key: RESERVATION_SLOT_MINUTES
        value: "120"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_DEFAULT_COUNTRY
        value: IT
      - key: PUBLIC_TABLE_PAYMENTS_ENABLED
        value: "false"
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_SEMIANNUAL
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        value: easy.menu.service@gmail.com
      - key: MAIL_FROM_NAME
        value: Ordynora
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: MONITOR_WEBHOOK_URL
        sync: false
      - key: MONITOR_WEBHOOK_TOKEN
        sync: false
      - key: BACKUP_ENABLED
        value: "false"
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_UPLOAD_URL
        sync: false
      - key: BACKUP_UPLOAD_TOKEN
        sync: false
